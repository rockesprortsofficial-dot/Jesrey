];
const labels=["FRONT","BACK"];
let i=0,down=false,last=0,timer=null;
const v=document.getElementById("viewer"),p=document.getElementById("jersey"),n=document.getElementById("name");
function show(x){i=(x+2)%2;p.src=frames[i];n.textContent=labels[i]}
function start(x){down=true;last=x}
function move(x){if(!down)return;let d=x-last;if(Math.abs(d)>25){show(i+(d<0?1:-1));last=x}}
function stop(){down=false}
v.addEventListener("touchstart",e=>start(e.touches[0].clientX),{passive:true});
v.addEventListener("touchmove",e=>move(e.touches[0].clientX),{passive:true});
v.addEventListener("touchend",stop);
v.addEventListener("mousedown",e=>start(e.clientX));
window.addEventListener("mousemove",e=>move(e.clientX));
window.addEventListener("mouseup",stop);
function toggle(){
 if(timer){clearInterval(timer);timer=null;document.getElementById("auto").textContent="▶ AUTO ROTATE"}
 else{timer=setInterval(()=>show(i+1),800);document.getElementById("auto").textContent="⏸ STOP ROTATE"}
}
show(0);
</script>
